# for github.com
approvals:
    minimum: 2
    from:
        orgs:
            - zalando
        collaborators: true

# mandatory pull request labels
pull-request:
    labels:
        additional: true
        oneOf:
            - architectural
            - major
            - minor
            - bugfix
            - documentation
            - dependencies

X-Zalando-Team: "pathfinder"
X-Zalando-Type: "code"
